name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No data in CI: emit empty artifacts so every page builds in its empty state.
      - name: OpenNext build + asset limit check
        run: |
          npx tsx scripts/emit-static.tsx --empty --no-og
          npm run cf:build && npm run cf:check

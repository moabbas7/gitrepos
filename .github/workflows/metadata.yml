name: refresh-metadata (every 6h)

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  D1_DAILY_WRITE_BUDGET: ${{ vars.D1_DAILY_WRITE_BUDGET || '80000' }}
  TRACKED_LIMIT: ${{ vars.TRACKED_LIMIT || '5000' }}
  DATA_PUSH: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Refresh metadata, spam guard, READMEs
        run: npm run job:metadata
      - name: Publish data branch
        if: always()
        run: npx tsx jobs/data.ts publish "metadata $(date -u +%Y-%m-%dT%H:%MZ)"

name: keepalive

# GitHub disables scheduled workflows in public repos after 60 days without repository activity.
# Re-enabling them through the API each month keeps the pipeline alive without dummy commits.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in hourly.yml metadata.yml daily.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/${wf}/enable" && echo "enabled ${wf}"
          done
